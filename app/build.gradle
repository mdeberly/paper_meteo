plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.pluie.kompakt'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.pluie.kompakt'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.2'
    }

    // Deux variantes, à partir du même code :
    //  - eink  : Mudita Kompakt et autres écrans E Ink, noir et blanc pur (identifiant d'origine,
    //            pour que les mises à jour s'installent par-dessus) ;
    //  - color : téléphones à écran couleur, thème clair aux tons chauds.
    // Elles peuvent être installées côte à côte.
    flavorDimensions 'display'
    productFlavors {
        eink {
            dimension 'display'
            applicationId 'fr.pluie.kompakt'
        }
        color {
            dimension 'display'
            applicationId 'fr.papermeteo.color'
        }
    }

    // Clé de signature fixe : chaque nouvelle version pourra s'installer par-dessus l'ancienne.
    signingConfigs {
        release {
            storeFile file('pluie.keystore')
            storePassword 'pluiepluie'
            keyAlias 'pluie'
            keyPassword 'pluiepluie'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
