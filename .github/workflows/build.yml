name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # pour publier une « Release » quand on pousse une étiquette v…

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PaperMeteo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperMeteo-apk
          path: PaperMeteo.apk

      # Branche release/<nom> (ex. release/v1.0-kompakt) : étiquette <nom> et Release GitHub
      # permanente avec l'APK, créées automatiquement sur ce commit.
      - name: Nom de l'étiquette
        if: startsWith(github.ref, 'refs/heads/release/')
        run: echo "TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"

      - name: Release
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: PaperMeteo.apk
