name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # pour publier une « Release » quand on pousse une étiquette v…

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PaperMeteo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperMeteo-apk
          path: PaperMeteo.apk

      # Étiquette v… (ex. v1.0-kompakt) : Release GitHub permanente avec l'APK.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PaperMeteo.apk
