name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # pour publier une « Release » quand on pousse une étiquette v…

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Jeton (secret APK_REPO_TOKEN) autorisé à publier dans le dépôt public mdeberly/paper_meteo-apk.
      APK_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/eink/release/app-eink-release.apk PaperMeteo-EInk.apk
          cp app/build/outputs/apk/color/release/app-color-release.apk PaperMeteo-Color.apk

      # Contrôle des APK : signature valide, paquet, numéro de version et empreinte du certificat
      # (l'empreinte doit rester la même d'une version à l'autre pour installer par-dessus).
      - name: Vérification des APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in PaperMeteo-EInk.apk PaperMeteo-Color.apk; do
            echo "== $f"
            unzip -tq "$f"
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "Verified|SHA-256|scheme"
            "$BT/aapt2" dump badging "$f" | grep -E "^package|sdkVersion"
          done

      # Variante E Ink (Mudita Kompakt…) : s'installe par-dessus les versions précédentes.
      - uses: actions/upload-artifact@v4
        with:
          name: PaperMeteo-EInk
          path: PaperMeteo-EInk.apk

      # Variante couleur (téléphones classiques) : application distincte, installable à côté.
      - uses: actions/upload-artifact@v4
        with:
          name: PaperMeteo-Color
          path: PaperMeteo-Color.apk

      # Branche release/<nom> (ex. release/v1.0-kompakt) : étiquette <nom> et Release GitHub
      # permanente avec l'APK, créées automatiquement sur ce commit.
      - name: Nom de l'étiquette
        if: startsWith(github.ref, 'refs/heads/release/')
        run: echo "TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"

      - name: Release
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            PaperMeteo-EInk.apk
            PaperMeteo-Color.apk

      # Même Release dans le dépôt public mdeberly/paper_meteo-apk : liens directs sans compte GitHub.
      # Dernière version toujours à : https://github.com/mdeberly/paper_meteo-apk/releases/latest
      - name: Release publique
        if: startsWith(github.ref, 'refs/heads/release/') && env.APK_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: mdeberly/paper_meteo-apk
          token: ${{ env.APK_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: Paper Meteo ${{ env.TAG }}
          make_latest: true
          body: |
            - PaperMeteo-EInk.apk : version noir et blanc pour liseuses / Mudita Kompakt
            - PaperMeteo-Color.apk : version couleur pour téléphones classiques
          files: |
            PaperMeteo-EInk.apk
            PaperMeteo-Color.apk
